<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OH! Civics — Civics Course</title>
<style>
:root{
  --navy:#11213f;--navy2:#20365f;--blue:#2563eb;--blue-2:#4f86f7;--blue-soft:#eaf2ff;
  --ink:#182238;--muted:#687892;--line:#dbe4ef;--paper:#fff;--bg:#f2f6fb;--gold:#f4c451;
  --green:#1fa866;--purple:#7357c8;--orange:#e9931a;--shadow:0 18px 48px rgba(26,44,78,.10);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
button{font:inherit}
button:focus-visible,a:focus-visible{outline:3px solid rgba(37,99,235,.30);outline-offset:3px}
#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.topbar{
  height:64px;flex:0 0 64px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:20px;padding:0 clamp(16px,3vw,42px);backdrop-filter:blur(14px)
}
.brand{font-size:25px;font-weight:950;letter-spacing:-.045em;color:var(--navy);white-space:nowrap;text-decoration:none}
.brand span{color:var(--blue)}
.course-track{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;min-width:0}
.track-dot{height:7px;flex:1;max-width:76px;border-radius:999px;background:#e4eaf2;transition:.25s ease}
.track-dot.on{background:linear-gradient(90deg,var(--blue),var(--blue-2))}
.track-dot.done{background:var(--green)}
.progress-copy{font-size:11px;font-weight:900;color:var(--muted);white-space:nowrap}

.home{
  flex:1;min-height:0;padding:clamp(18px,3.4vh,40px) clamp(18px,4vw,58px) clamp(18px,3vh,34px);
  display:grid;grid-template-rows:auto minmax(0,1fr);gap:clamp(16px,2.6vh,26px);overflow:hidden
}
.hero{display:flex;align-items:end;justify-content:space-between;gap:28px;min-width:0}
.hero-copy{max-width:780px;min-width:0}
.eyebrow{font-size:11px;font-weight:950;letter-spacing:.15em;text-transform:uppercase;color:var(--blue);margin-bottom:7px}
.hero h1{margin:0;color:var(--navy);font-size:clamp(34px,5vw,68px);line-height:.94;letter-spacing:-.055em}
.hero p{margin:10px 0 0;color:var(--muted);font-size:clamp(13px,1.18vw,17px);line-height:1.4;max-width:700px}
.hero-badge{
  background:linear-gradient(145deg,#fff,#f7faff);border:1px solid var(--line);border-radius:19px;
  padding:13px 18px;text-align:center;min-width:136px;box-shadow:0 10px 28px rgba(20,33,61,.06)
}
.hero-badge b{display:block;font-size:23px;color:var(--navy);letter-spacing:-.03em}
.hero-badge span{font-size:11px;font-weight:850;color:var(--muted)}

.modules{min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.module{
  --accent:var(--blue);position:relative;min-width:0;min-height:0;border:1px solid var(--line);
  background:linear-gradient(165deg,#fff 0%,#fff 68%,#f7faff 100%);border-radius:24px;padding:18px;
  cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease
}
.module:nth-child(2){--accent:#6176dc}.module:nth-child(3){--accent:#7a5ac8}.module:nth-child(4){--accent:#d18b26}.module:nth-child(5){--accent:#2a9c77}
.module:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--accent)}
.module:after{
  content:"";position:absolute;width:118px;height:118px;border-radius:50%;right:-54px;top:38%;
  background:color-mix(in srgb,var(--accent) 8%,transparent);pointer-events:none
}
.module:hover:not(.locked){transform:translateY(-5px);box-shadow:var(--shadow);border-color:#bacce4}
.module.locked{opacity:.52;cursor:not-allowed;filter:saturate(.7)}
.module.done{border:2px solid #88d5aa}
.module.done:before{background:var(--green)}
.module-num{
  width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--accent) 11%,white);
  color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:950
}
.module-icon{
  width:clamp(54px,5vw,72px);height:clamp(54px,5vw,72px);border-radius:20px;
  background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 11%,white),#fff);
  border:1px solid color-mix(in srgb,var(--accent) 17%,#e8edf4);display:grid;place-items:center;
  font-size:clamp(29px,3vw,43px);line-height:1;margin:clamp(12px,2vh,20px) 0;box-shadow:0 8px 20px rgba(28,48,83,.06)
}
.module h2{font-size:clamp(16px,1.5vw,23px);line-height:1.05;letter-spacing:-.028em;color:var(--navy);margin:0 0 7px;max-width:12ch}
.module p{font-size:12px;line-height:1.35;color:var(--muted);margin:0;font-weight:650}
.module-status{font-size:11px;font-weight:950;color:var(--accent);margin-top:12px}

.lesson{position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,#eef3f9,#f6f8fb);display:none;flex-direction:column;overflow:hidden}
.lesson.open{display:flex}
.lessonbar{
  height:60px;flex:0 0 60px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:0 clamp(12px,2vw,28px);backdrop-filter:blur(12px)
}
.icon-btn{width:38px;height:38px;border:0;border-radius:50%;background:#eef3f8;color:var(--navy);font-size:21px;cursor:pointer}
.icon-btn:hover{background:#e4ebf4}
.lesson-title{font-size:14px;font-weight:950;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson-count{font-size:11px;font-weight:900;color:var(--muted)}

.stage{
  position:relative;flex:1;min-height:0;padding:clamp(12px,2vh,20px) clamp(12px,3vw,40px) clamp(10px,1.6vh,16px);
  display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr) auto;
  gap:12px 18px;overflow:hidden
}
.slide{
  grid-column:1/-1;grid-row:1;justify-self:center;align-self:stretch;width:min(1160px,100%);height:100%;min-height:0;
  background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;
  display:grid;grid-template-columns:minmax(0,1.03fr) minmax(0,.97fr);align-items:stretch
}
.slide-copy{
  padding:clamp(26px,4vw,54px);display:flex;flex-direction:column;justify-content:center;min-width:0;overflow:hidden
}
.kicker{
  display:inline-flex;align-self:flex-start;padding:7px 11px;border-radius:999px;background:var(--blue-soft);
  color:var(--blue);font-size:10px;font-weight:950;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px
}
.slide h2{margin:0 0 12px;color:var(--navy);font-size:clamp(30px,4vw,54px);line-height:.99;letter-spacing:-.045em;max-width:13ch}
.slide p{margin:0;color:var(--muted);font-size:clamp(14px,1.35vw,18px);line-height:1.46;max-width:560px}
.micro{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap}
.micro span{font-size:11px;font-weight:900;color:#4f627e;background:#f5f7fa;border:1px solid var(--line);padding:8px 10px;border-radius:999px}

.visual{
  position:relative;min-width:0;min-height:0;background:
    radial-gradient(circle at 82% 18%,rgba(79,134,247,.13),transparent 26%),
    radial-gradient(circle at 18% 82%,rgba(115,87,200,.09),transparent 25%),
    linear-gradient(145deg,#edf5ff,#fbfdff);
  border-left:1px solid #deebfb;display:flex;align-items:center;justify-content:center;
  padding:clamp(20px,3vw,40px);overflow:hidden
}
.visual:after{content:"";position:absolute;width:150px;height:150px;border:1px solid rgba(37,99,235,.08);border-radius:50%;right:-62px;bottom:-72px;pointer-events:none}
.big-icon{
  position:relative;z-index:1;width:clamp(150px,18vw,220px);height:clamp(150px,18vw,220px);
  border-radius:40%;display:grid;place-items:center;background:rgba(255,255,255,.78);
  border:1px solid rgba(255,255,255,.9);box-shadow:0 20px 44px rgba(25,48,91,.11);
  font-size:clamp(78px,9vw,126px);line-height:1
}
.visual-caption{
  position:absolute;z-index:2;left:22px;right:22px;bottom:18px;text-align:center;font-size:11px;font-weight:900;color:#5d6f89
}
.map{position:relative;z-index:1;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}
.map-step{
  min-width:88px;padding:14px 11px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:15px;
  text-align:center;font-size:12px;font-weight:950;color:var(--navy);box-shadow:0 7px 18px rgba(20,33,61,.06)
}
.map-arrow{color:var(--blue);font-size:20px;font-weight:950}
.real{
  position:relative;z-index:1;width:100%;max-width:440px;background:rgba(255,255,255,.94);border:1px solid var(--line);
  border-radius:22px;padding:20px;box-shadow:0 12px 32px rgba(20,33,61,.08)
}
.real-tag{
  display:inline-block;font-size:10px;font-weight:950;letter-spacing:.1em;text-transform:uppercase;color:#7a5900;
  background:#fff0b8;border-radius:999px;padding:6px 9px;margin-bottom:12px
}
.real h3{font-size:22px;letter-spacing:-.03em;color:var(--navy);margin:0 0 8px}
.real p{font-size:13px;line-height:1.42;color:var(--muted);margin:0}
.real-flow{margin-top:16px;display:flex;gap:6px;flex-wrap:wrap}
.real-flow span{font-size:10px;font-weight:950;border-radius:999px;padding:7px 9px;background:#f1f5fa;color:#50617a;border:1px solid #e3e9f1}
.source-link{display:inline-block;margin-top:14px;font-size:11px;font-weight:900;color:var(--blue);text-decoration:none}
.source-link:hover{text-decoration:underline}

.people{position:relative;z-index:1;width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.person{
  background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:18px;padding:18px 10px;text-align:center;
  box-shadow:0 8px 20px rgba(24,43,78,.05)
}
.person .emoji{font-size:38px}
.person b{display:block;margin-top:9px;font-size:12px;color:var(--navy)}
.person span{display:block;font-size:10px;color:var(--muted);margin-top:3px}

.compare{position:relative;z-index:1;width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.doc{
  min-height:190px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;padding:18px;
  display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 20px rgba(24,43,78,.05)
}
.doc b{font-size:12px;color:var(--navy)}
.line{height:8px;border-radius:999px;background:#dce4ee}.line.short{width:60%}.line.changed{background:#8db8ff}
.compare-arrow{font-size:24px;color:var(--blue)}
.quiz{position:relative;z-index:1;width:100%;max-width:440px;display:grid;gap:9px}
.quiz button{
  border:2px solid #dce4ee;background:rgba(255,255,255,.95);border-radius:15px;padding:13px 14px;text-align:left;
  color:var(--navy);font-size:12px;font-weight:900;cursor:pointer;transition:.15s ease
}
.quiz button:hover{border-color:var(--blue);transform:translateY(-1px)}
.quiz button.right{border-color:var(--green);background:#effcf4}
.quiz button.wrong{border-color:var(--orange);background:#fff8e9}
.quiz-feedback{min-height:30px;font-size:11px;font-weight:850;color:#52657f;padding-top:3px}

.game-pair{position:relative;z-index:1;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{
  border-radius:20px;padding:20px;color:#fff;background:linear-gradient(145deg,var(--navy),var(--navy2));
  min-height:185px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 12px 28px rgba(20,33,61,.16)
}
.game.alt{background:linear-gradient(145deg,#6748ab,#8467cf)}
.game .emoji{font-size:42px}.game h3{margin:9px 0 4px;font-size:17px}.game p{margin:0;color:#e5ebf7;font-size:11px;line-height:1.36}

.guide{
  position:static;grid-column:1;grid-row:2;z-index:5;display:flex;align-items:center;gap:10px;
  min-width:0;max-width:760px;justify-self:start;pointer-events:none
}
.avatar{
  flex:0 0 auto;width:58px;height:58px;border-radius:50%;border:4px solid #fff;background:linear-gradient(145deg,#ffd66b,var(--gold));
  display:grid;place-items:center;font-size:32px;box-shadow:0 8px 22px rgba(20,33,61,.14)
}
.bubble{
  width:auto;max-width:620px;min-width:0;background:var(--navy);color:#fff;border-radius:16px 16px 16px 5px;
  padding:10px 14px;font-size:11.5px;line-height:1.36;box-shadow:0 9px 24px rgba(20,33,61,.15)
}
.guide-name{font-size:8.5px;text-transform:uppercase;letter-spacing:.11em;font-weight:950;color:#a9c9ff;margin-bottom:3px}

.nav{
  position:static;grid-column:2;grid-row:2;z-index:6;display:flex;align-items:center;justify-self:end;align-self:center;gap:8px
}
.nav button{border:0;border-radius:12px;padding:10px 15px;font-size:11px;font-weight:950;cursor:pointer;white-space:nowrap}
.prev{background:#fff;color:var(--navy);border:1px solid var(--line)!important}
.prev:hover{background:#f7f9fc}.next{background:var(--blue);color:#fff;box-shadow:0 7px 16px rgba(37,99,235,.20)}
.next:hover{background:#1f57d2}.next.finish{background:var(--green);box-shadow:0 7px 16px rgba(31,168,102,.20)}
.slide-dots{display:flex;gap:5px;margin-right:5px}
.slide-dots i{display:block;width:7px;height:7px;border-radius:50%;background:#cfd8e5}.slide-dots i.on{background:var(--blue)}

.module-intro{
  position:absolute;inset:0;z-index:30;background:rgba(236,242,249,.88);backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;padding:64px 20px 20px
}
.module-intro.show{display:flex}
.intro-card{
  position:relative;width:min(520px,92vw);background:#fff;border:1px solid var(--line);border-radius:28px;
  padding:58px 32px 30px;text-align:center;box-shadow:0 28px 80px rgba(20,33,61,.18)
}
.intro-avatar{
  position:absolute;left:50%;top:-44px;transform:translateX(-50%);width:88px;height:88px;border-radius:50%;
  background:linear-gradient(145deg,#ffd66b,var(--gold));border:6px solid #fff;box-shadow:0 10px 30px rgba(20,33,61,.12);
  display:grid;place-items:center;font-size:49px;margin:0
}
.intro-card .small{font-size:10px;text-transform:uppercase;letter-spacing:.13em;font-weight:950;color:var(--blue)}
.intro-card h2{margin:7px 0 9px;font-size:32px;line-height:1.02;letter-spacing:-.04em;color:var(--navy)}
.intro-card p{margin:0 auto 20px;color:var(--muted);font-size:14px;line-height:1.45;max-width:410px}
.start-btn{border:0;border-radius:14px;background:var(--blue);color:#fff;font-weight:950;padding:12px 20px;cursor:pointer;box-shadow:0 7px 16px rgba(37,99,235,.18)}

@media(max-width:1024px){
  .hero-badge{display:none}
  .modules{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:10px}
  .module{padding:14px;border-radius:20px}
  .module-icon{width:52px;height:52px;border-radius:16px;font-size:30px;margin:10px 0}
  .module h2{font-size:17px}.module p{font-size:11px}
  .slide{grid-template-columns:minmax(0,1fr) minmax(0,.86fr)}
  .slide-copy{padding:clamp(22px,3vw,38px)}
  .slide h2{font-size:clamp(28px,4.5vw,43px)}
  .people{grid-template-columns:1fr;gap:7px}.person{padding:9px}.person .emoji{font-size:25px}
}

@media(max-width:680px){
  .topbar{height:52px;flex-basis:52px;padding:0 12px;gap:10px}.brand{font-size:20px}.progress-copy{display:none}
  .course-track{gap:4px}.track-dot{height:6px}
  .home{padding:12px;gap:10px}
  .hero{align-items:start}.eyebrow{font-size:9px;margin-bottom:4px}.hero h1{font-size:29px;line-height:.95}.hero p{font-size:11.5px;line-height:1.3;margin-top:6px;max-width:52ch}
  .modules{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:7px}
  .module{padding:10px 9px;border-radius:16px;align-items:flex-start;text-align:left}
  .module:after{width:80px;height:80px;right:-42px}
  .module-num{width:28px;height:28px;border-radius:9px;font-size:9px}
  .module-icon{width:44px;height:44px;border-radius:14px;font-size:25px;margin:7px 0}
  .module h2{font-size:12.5px;line-height:1.05;margin-bottom:3px;max-width:11ch}.module p{display:none}.module-status{font-size:9px;margin-top:6px}
  .lessonbar{height:50px;flex-basis:50px;padding:0 10px;gap:9px}.icon-btn{width:34px;height:34px}.lesson-title{font-size:12px}.lesson-count{font-size:10px}
  .stage{padding:8px 9px 8px;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto auto;gap:7px}
  .slide{grid-column:1;grid-row:1;width:100%;height:100%;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);border-radius:19px}
  .slide-copy{padding:16px 17px 14px;justify-content:flex-start}
  .kicker{font-size:8px;margin-bottom:7px;padding:5px 8px}
  .slide h2{font-size:clamp(21px,7vw,27px);line-height:1.01;margin-bottom:7px;max-width:18ch}
  .slide p{font-size:11.5px;line-height:1.34;max-width:none}
  .micro{margin-top:9px;gap:4px}.micro span{font-size:8.5px;padding:5px 7px}
  .visual{border-left:0;border-top:1px solid #deebfb;padding:12px 14px;min-height:0}
  .big-icon{width:116px;height:116px;border-radius:34%;font-size:62px}.visual-caption{font-size:9px;bottom:8px}
  .map{gap:4px}.map-step{min-width:57px;padding:8px 6px;font-size:9px;border-radius:10px}.map-arrow{font-size:13px}
  .real{max-width:360px;padding:12px 13px;border-radius:15px}.real-tag{font-size:7.5px;padding:4px 6px;margin-bottom:7px}.real h3{font-size:16px;margin-bottom:5px}.real p{font-size:9.5px;line-height:1.32}.real-flow{margin-top:8px;gap:4px}.real-flow span{font-size:7.5px;padding:4px 6px}.source-link{font-size:8.5px;margin-top:8px}
  .people{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.person{padding:9px 5px;border-radius:12px}.person .emoji{font-size:22px}.person b{font-size:9px;margin-top:4px}.person span{font-size:7.5px}
  .doc{min-height:100px;padding:10px;gap:6px;border-radius:13px}.doc b{font-size:9px}.line{height:5px}.compare{gap:5px}.compare-arrow{font-size:15px}
  .quiz{gap:5px;max-width:360px}.quiz button{padding:8px 9px;font-size:9px;border-radius:10px}.quiz-feedback{font-size:8.5px;min-height:17px}
  .game-pair{gap:7px}.game{padding:11px 12px;border-radius:14px;min-height:112px}.game .emoji{font-size:27px}.game h3{font-size:11px;margin:5px 0 2px}.game p{font-size:8.5px}
  .guide{grid-column:1;grid-row:2;width:100%;max-width:none;gap:7px;justify-self:stretch}
  .avatar{width:40px;height:40px;border-width:3px;font-size:23px}
  .bubble{flex:1;max-width:none;padding:7px 9px;border-radius:11px 11px 11px 4px;font-size:9.5px;line-height:1.26}
  .guide-name{font-size:6.8px;margin-bottom:2px}
  .nav{grid-column:1;grid-row:3;width:100%;justify-content:flex-end;gap:6px}
  .nav button{padding:7px 11px;font-size:9.5px;border-radius:9px}.slide-dots{margin-right:auto}
  .slide-dots i{width:6px;height:6px}
  .module-intro{padding:58px 14px 14px}
  .intro-card{padding:48px 18px 22px;border-radius:22px}.intro-avatar{width:72px;height:72px;top:-36px;font-size:40px;border-width:5px}
  .intro-card h2{font-size:25px}.intro-card p{font-size:12px;margin-bottom:16px}.start-btn{padding:10px 15px;font-size:12px}
}

@media(max-width:420px){
  .hero p{max-width:42ch}
  .modules{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:6px}
  .module{padding:8px}.module-icon{width:38px;height:38px;font-size:22px;margin:5px 0}.module h2{font-size:11.5px}.module-status{font-size:8px}
  .slide-copy{padding:13px 14px 11px}.slide h2{font-size:21px}.slide p{font-size:10.8px}.visual{padding:9px 10px}
  .bubble{font-size:9px}.nav button{font-size:9px;padding:7px 9px}
}

@media(max-height:680px) and (min-width:681px){
  .topbar{height:54px;flex-basis:54px}
  .home{padding-top:14px;gap:12px}.hero h1{font-size:40px}.hero p{font-size:12px}
  .module-icon{width:46px;height:46px;font-size:28px;margin:8px 0}.module p{display:none}
  .stage{padding-top:8px;gap:8px}.slide-copy{padding:24px 30px}.slide h2{font-size:34px}.slide p{font-size:13px}
  .guide{gap:8px}.avatar{width:48px;height:48px;font-size:27px}.bubble{font-size:10px;padding:8px 11px}.nav button{padding:8px 12px}
  .real{padding:15px}.doc{min-height:145px}.game{min-height:145px}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Back to OH! Civics home" title="Back to OH! Civics home">OH! <span>Civics</span></a>
    <div class="course-track" id="courseTrack"></div>
    <div class="progress-copy" id="progressCopy">Level 1 of 5</div>
  </header>

  <main class="home">
    <section class="hero">
      <div class="hero-copy">
        <div class="eyebrow">Civics Course</div>
        <h1>See it. Click it. Understand it.</h1>
        <p>Five guided levels build a practical picture of Ohio lawmaking through real records, decisions, and source checks.</p>
      </div>
      <div class="hero-badge"><b>30–35 min</b><span>full course</span></div>
    </section>
    <section class="modules" id="modules"></section>
  </main>
</div>

<section class="lesson" id="lesson">
  <header class="lessonbar">
    <button class="icon-btn" id="closeBtn" aria-label="Close module">×</button>
    <div class="lesson-title" id="lessonTitle"></div>
    <div class="lesson-count" id="lessonCount"></div>
  </header>

  <div class="stage">
    <article class="slide" id="slide"></article>

    <div class="guide">
      <div class="avatar">🧑🏽‍🏫</div>
      <div class="bubble">
        <div class="guide-name">Maya • your guide</div>
        <div id="guideText"></div>
      </div>
    </div>

    <div class="nav">
      <div class="slide-dots" id="slideDots"></div>
      <button class="prev" id="prevBtn">← Back</button>
      <button class="next" id="nextBtn">Next →</button>
    </div>

    <div class="module-intro" id="moduleIntro">
      <div class="intro-card">
        <div class="intro-avatar">🧑🏽‍🏫</div>
        <div class="small" id="introSmall">Level 1</div>
        <h2 id="introTitle"></h2>
        <p id="introText"></p>
        <button class="start-btn" id="startBtn">Start presentation →</button>
      </div>
    </div>
  </div>
</section>

<script>
const SOURCE = {
  process:"https://www.legislature.ohio.gov/publications/the-legislative-process",
  hb96:"https://www.legislature.ohio.gov/legislation/136/hb96/status",
  hb96docs:"https://www.legislature.ohio.gov/legislation/136/hb96/documents",
  hb750:"https://www.legislature.ohio.gov/legislation/136/hb750/committee",
  hb561:"https://www.legislature.ohio.gov/legislation/136/hb561/committee"
};

const course = [
{
  title:"Meet the System", icon:"🏛️", duration:"~6 min", teaser:"roles + responsibility",
  intro:"Build the map first. Then practice deciding which part of Ohio government is responsible for each step.",
  slides:[
    {type:"icon",kicker:"Big Picture",title:"Three branches. Three different jobs.",text:"Ohio state government separates lawmaking, implementation, and legal interpretation. The useful starting point is the job each branch performs—not a long list of names.",icon:"🏛️",caption:"Legislative • Executive • Judicial",guide:"Keep the mental model simple: make laws, carry them out, resolve legal disputes.",chips:["Make laws","Carry out laws","Interpret laws"]},
    {type:"people",kicker:"Legislative Branch",title:"The General Assembly is where state bills move.",text:"Ohio's legislature has a House and a Senate. A proposal can be introduced in one chamber and must ultimately make it through both.",people:[["🏠","House","First chamber or second"],["🏛️","Senate","First chamber or second"],["📝","Bill","The text being considered"]],guide:"A news story may focus on one chamber, but statewide legislation usually requires action in both.",source:"process"},
    {type:"icon",kicker:"Executive Branch",title:"Passing a law is not the same as implementing it.",text:"After enactment, executive officials and agencies may administer programs, enforce requirements, spend appropriated funds, or carry out duties created by law.",icon:"⚙️",caption:"Law → administration → implementation",guide:"That distinction matters: lawmakers can set the policy while agencies handle many operational details."},
    {type:"icon",kicker:"Judicial Branch",title:"Courts answer legal questions through cases.",text:"Courts do not act as another legislative chamber. They resolve disputes and interpret legal text when cases come before them.",icon:"⚖️",caption:"Cases • disputes • interpretation",guide:"When a court is involved, ask what legal question or dispute the court is actually deciding."},
    {type:"real",kicker:"Practical Ohio Example",title:"H.B. 96 shows different institutions doing different jobs.",text:"Ohio's 2025 operating-budget bill moved through the legislature, reached the Governor, was signed on June 30, 2025, and later had legislative votes concerning vetoed items.",realTitle:"H.B. 96 • State operating budget",realText:"The official status history lets you separate legislative actions from gubernatorial actions instead of treating 'government' as one actor.",realFlow:["Legislature","Governor","Veto items","Override votes"],source:"hb96",guide:"A strong civic habit is to name the institution that actually took the action."},
    {type:"quiz",kicker:"Apply It",title:"A proposal would change an Ohio statute. Where does the bill process happen?",text:"Choose the institution that considers the statutory change.",answers:["The General Assembly","A state trial court","A state agency press office"],correct:0,success:"Correct. Bills to create or change statutes move through the legislative process.",guide:"Good. You now have the institutional map for the rest of the course.",source:"process"}
  ]
},
{
  title:"Follow a Bill", icon:"📜", duration:"~7 min", teaser:"idea → law",
  intro:"Follow a proposal through the major checkpoints and see where it can change, stall, or stop.",
  slides:[
    {type:"icon",kicker:"Step 1",title:"An idea has to become legislative text.",text:"Ohio's legislative-process guide begins with a legislator identifying a need for legislation and having a proposed bill drafted for introduction.",icon:"💡",caption:"Idea → draft → introduced bill",guide:"The first practical question is: what does the actual proposed text say?",source:"process"},
    {type:"map",kicker:"Step 2",title:"Introduction is the start—not passage.",text:"After introduction, a bill receives a number and is referred into the committee process.",steps:["Introduced","Numbered","Referred","Committee"],guide:"A bill number means a proposal exists. It does not mean the proposal has become law.",source:"process"},
    {type:"map",kicker:"Step 3",title:"Committee is a real decision point.",text:"Standing committees hold public hearings and may amend a bill, create a substitute bill, postpone action, or defeat it.",steps:["Hear","Question","Amend","Report?"],guide:"A bill can change substantially here—or never leave committee.",source:"process"},
    {type:"map",kicker:"Step 4",title:"The first chamber votes.",text:"If a bill advances from committee, the full chamber can debate and vote. Failure to pass can end the bill's path.",steps:["Committee report","Floor debate","Vote"],guide:"Committee approval and chamber passage are separate checkpoints.",source:"process"},
    {type:"map",kicker:"Step 5",title:"Then the other chamber gets its own say.",text:"The second chamber repeats its own committee and floor process and can amend the proposal.",steps:["Other chamber","Committee","Floor","Vote"],guide:"When someone says a bill 'passed,' ask: passed committee, one chamber, or both?",source:"process"},
    {type:"map",kicker:"Step 6",title:"Different versions have to be reconciled.",text:"If the second chamber changes a bill and the originating chamber does not accept those changes, a conference committee may be used to work toward agreement.",steps:["Version A","Version B","Conference?","Agreement"],guide:"Both chambers ultimately need to approve the same legislative text.",source:"process"},
    {type:"real",kicker:"Trace a Real Bill",title:"H.B. 96 leaves a public timeline.",text:"The official status page records House passage, Senate passage, disagreement over Senate amendments, conference activity, agreement to the conference report, delivery to the Governor, and signature.",realTitle:"Practice: reconstruct the sequence",realText:"The status page lets you test a summary against the official procedural record instead of relying on a headline.",realFlow:["House","Senate","Conference","Governor"],source:"hb96",guide:"You do not have to memorize every procedural term. Learn to reconstruct what happened in order."},
    {type:"quiz",kicker:"Decision Check",title:"The second chamber changes the bill. What has to happen next?",text:"Choose the strongest description.",answers:["The chambers must resolve the differences and approve the same text","The second chamber's version automatically becomes law","The committee chair alone selects the final text"],correct:0,success:"Exactly. Differences must be resolved before the legislation can proceed as a final bill.",guide:"Now the process is a sequence of checkpoints instead of one mysterious pass/fail event.",source:"process"}
  ]
},
{
  title:"Inside Committee", icon:"🎤", duration:"~7 min", teaser:"evidence + tradeoffs",
  intro:"Go inside the stage where witnesses, lawmakers, amendments, and competing claims meet.",
  slides:[
    {type:"people",kicker:"Hearing Room",title:"Witness labels tell you a role—not whether someone is correct.",text:"Committee records can identify sponsor, proponent, opponent, and interested-party testimony.",people:[["🧑‍💼","Sponsor","Explains proposal"],["👍","Proponent","Supports proposal"],["👎","Opponent","Opposes proposal"]],guide:"Use the label to understand the witness's position. Then evaluate the actual argument and evidence.",source:"process"},
    {type:"map",kicker:"Read Testimony",title:"Break an argument into four parts.",text:"Instead of asking only whether you agree, identify the claim, supporting evidence, who is affected, and the tradeoff or uncertainty.",steps:["Claim","Evidence","Impact","Tradeoff"],guide:"This turns testimony from 'agree or disagree' into something you can actually analyze."},
    {type:"map",kicker:"Committee Work",title:"Hearings can lead to revisions.",text:"Committees can ask questions, consider amendments, create substitute bills, and decide whether to report a proposal.",steps:["Testimony","Questions","Amend","Substitute?","Report?"],guide:"The room is not just producing speeches. It can produce changes to the bill.",source:"process"},
    {type:"real",kicker:"Health Example",title:"H.B. 750 drew several kinds of testimony in 2026.",text:"The House Health Committee record shows sponsor testimony in March, multiple proponents in May, opponent testimony in June, and additional committee activity.",realTitle:"H.B. 750 • House Health Committee",realText:"The official page links individual testimony documents, letting you inspect what witnesses actually submitted.",realFlow:["Sponsors","Proponents","Opponent","More hearings"],source:"hb750",guide:"This is the model for the Health Committee game: characters should bring identifiable claims, evidence, and concerns."},
    {type:"real",kicker:"Compare a Second Case",title:"H.B. 561 shows disagreement across hearings.",text:"The House Health Committee record lists proponent testimony at earlier 2026 hearings and opponent testimony at a later hearing.",realTitle:"H.B. 561 • House Health Committee",realText:"A useful comparison asks whether witnesses disagree about the goal, evidence, implementation, or risk.",realFlow:["Proponents","Opponents","Compare claims","Ask questions"],source:"hb561",guide:"The goal is not to turn disagreement into a score. It is to identify what the disagreement is actually about."},
    {type:"quiz",kicker:"You Are Committee Staff",title:"Two witnesses make conflicting factual claims. What is the strongest next move?",text:"Choose the best civic-analysis step.",answers:["Compare their evidence and the bill text","Choose whichever witness spoke first","Treat proponent/opponent labels as proof"],correct:0,success:"Correct. Check evidence, language, and impact rather than using the witness label as a shortcut.",guide:"That is the type of judgment the Health Committee game should reward."},
    {type:"quiz",kicker:"Committee Check",title:"Does public testimony itself enact the bill?",text:"Select the accurate statement.",answers:["No. It informs the committee; lawmakers still take legislative action","Yes. Enough testimony automatically makes the bill law","Only opponent testimony triggers final passage"],correct:0,success:"Right. Testimony contributes information and arguments, but it does not itself enact legislation.",guide:"You now know what the hearing stage can do—and what it cannot do.",source:"process"}
  ]
},
{
  title:"Words Become Policy", icon:"✍️", duration:"~7 min", teaser:"draft + revise",
  intro:"Read policy language as design choices: who, what, how much, when, and who implements it.",
  slides:[
    {type:"compare",kicker:"Drafting",title:"Small wording changes can create real policy changes.",text:"Definitions, eligibility rules, exceptions, dates, funding, and implementation instructions can determine who is covered and how a program works.",guide:"This is the core idea behind Culture Drafting: the wording is part of the policy."},
    {type:"map",kicker:"Policy Lens",title:"Ask five questions of any draft.",text:"A fast first read can look for the population, required action, resources, timeline, and implementing institution.",steps:["Who?","What?","Money?","When?","Who runs it?"],guide:"These five questions help you find the policy's operating structure before getting lost in details."},
    {type:"compare",kicker:"Versions",title:"The title can stay the same while the policy changes.",text:"Amendments and substitute bills can alter the substance of a proposal during the legislative process.",guide:"Whenever a debate refers to 'the bill,' ask which version is being discussed.",source:"process"},
    {type:"real",kicker:"Real Version History",title:"H.B. 96 has multiple official legislative versions.",text:"The Ohio Legislature posts H.B. 96 as introduced, as reported by committees, as passed by the House and Senate, as reported by conference, and as enrolled.",realTitle:"One bill • multiple documents",realText:"Comparing versions is a concrete way to see which language changed as a bill moved.",realFlow:["Introduced","House","Senate","Conference","Enrolled"],source:"hb96docs",guide:"A good summary should match the version that was actually current at the time being discussed."},
    {type:"map",kicker:"Drafting Practice",title:"Turn a broad goal into operational language.",text:"Suppose the goal is to fund local arts programs. The draft still has to answer who qualifies, what costs count, how much funding is available, and how results are reported.",steps:["Goal","Eligibility","Funding","Rules","Reporting"],guide:"A broad idea becomes implementable only when the draft answers concrete questions."},
    {type:"quiz",kicker:"Drafting Choice",title:"A program sounds popular, but the draft never says who qualifies. What is missing?",text:"Identify the policy-design problem.",answers:["Eligibility language","The bill number","The name of the Statehouse"],correct:0,success:"Correct. Without clear eligibility language, the scope of the policy may be unclear.",guide:"In Culture Drafting, every clause should have a job."},
    {type:"quiz",kicker:"Version Check",title:"The title of a bill is unchanged. Can you assume the policy is unchanged?",text:"Choose the strongest answer.",answers:["No. Check the current text and version history","Yes. A stable title means stable substance","Only social-media summaries can show changes"],correct:0,success:"Right. Version history can reveal substantive revisions even when the bill number and title stay the same.",guide:"This is the drafting habit to carry into the game.",source:"hb96docs"}
  ]
},
{
  title:"Verify + Practice", icon:"🔎", duration:"~7 min", teaser:"sources → action",
  intro:"Turn the process into a repeatable civic skill: verify a claim, locate the matching public record, then practice the same reasoning in the games.",
  slides:[
    {type:"map",kicker:"Source Check",title:"Match the source to the claim.",text:"Different claims require different records. A status claim needs a status history; a wording claim needs bill text; a testimony claim needs the committee record.",steps:["Claim","Right record","Read context","Compare"],guide:"The strongest source is not simply the most official-looking page. It is the record that actually answers your question."},
    {type:"real",kicker:"Verification Example",title:"A post says H.B. 96 was signed June 30, 2025.",text:"The official status page records 'Signed By The Governor' on June 30, 2025. It also shows additional later activity involving vetoed items.",realTitle:"Verify the narrow claim, then read the context",realText:"The first sentence can be correct while a broader interpretation of the bill's history is incomplete.",realFlow:["Claim","Status page","Date","Context"],source:"hb96",guide:"Verification is not only asking 'true or false?' It is also asking whether important context was left out."},
    {type:"quiz",kicker:"Source Choice",title:"Someone says a bill changed in committee. What should you inspect first?",text:"Choose the most directly relevant record.",answers:["The current and earlier bill versions or committee bill text","A viral reaction post","An unrelated statewide poll"],correct:0,success:"Correct. Compare the actual text or version history to identify what changed.",guide:"Match evidence to the claim before evaluating reactions.",source:"hb96docs"},
    {type:"quiz",kicker:"Source Choice",title:"Someone says 'dozens of people opposed this bill in committee.' What record helps test that claim?",text:"Pick the strongest first source.",answers:["The committee testimony record","The Governor's biography","A different bill's fiscal note"],correct:0,success:"Exactly. Committee pages can show hearings, witness names, and how testimony was categorized.",guide:"For testimony claims, go to the hearing record.",source:"hb750"},
    {type:"games",kicker:"Practice It",title:"Now use the same skills inside the games.",text:"The Health Committee game practices evidence and hearing decisions. Culture Drafting practices turning goals into legislative language.",guide:"The games are the applied portion of the course—not a separate set of disconnected activities."},
    {type:"map",kicker:"Health Committee Game",title:"Use evidence before making the committee's next move.",text:"Meet witnesses, compare claims, ask questions, consider amendments, and decide what happens next.",steps:["Witnesses","Evidence","Questions","Amend?","Vote"],guide:"You should now understand what each step represents in the real legislative process.",source:"process"},
    {type:"map",kicker:"Culture Drafting Game",title:"Build a bill by giving each clause a job.",text:"Translate a policy goal into eligibility, mechanism, accountability, and revision choices.",steps:["Goal","Draft","Test","Revise","Final text"],guide:"You are practicing the same drafting questions from the previous level."},
    {type:"icon",kicker:"Course Complete",title:"You can now follow, question, and verify the process.",text:"The goal is not memorizing every procedural detail. It is knowing where to look, what question to ask, and which record can answer it.",icon:"✅",caption:"Understand → verify → practice",guide:"Use the games to apply the skills, then return to real Ohio records whenever you want to test a claim."}
  ]
}
];

let unlocked = Number(localStorage.getItem("ohCourseUnlockedV2") || 0);
let completed = JSON.parse(localStorage.getItem("ohCourseCompletedV2") || "[]");
let activeLevel = 0;
let activeSlide = 0;

const modulesEl = document.getElementById("modules");
const trackEl = document.getElementById("courseTrack");
const progressCopy = document.getElementById("progressCopy");
const lesson = document.getElementById("lesson");
const lessonTitle = document.getElementById("lessonTitle");
const lessonCount = document.getElementById("lessonCount");
const slide = document.getElementById("slide");
const guideText = document.getElementById("guideText");
const dots = document.getElementById("slideDots");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const intro = document.getElementById("moduleIntro");
const introSmall = document.getElementById("introSmall");
const introTitle = document.getElementById("introTitle");
const introText = document.getElementById("introText");

function renderHome(){
  modulesEl.innerHTML="";
  trackEl.innerHTML="";
  course.forEach((m,i)=>{
    const locked=i>unlocked, done=completed.includes(i);
    const b=document.createElement("button");
    b.className="module"+(locked?" locked":"")+(done?" done":"");
    b.innerHTML='<div><div class="module-num">0'+(i+1)+'</div><div class="module-icon">'+m.icon+'</div><h2>'+m.title+'</h2><p>'+m.duration+' · '+m.teaser+'</p></div><div class="module-status">'+(done?"✓ Complete":locked?"🔒 Locked":"Open level →")+'</div>';
    b.onclick=()=>{if(!locked)openLevel(i)};
    modulesEl.appendChild(b);

    const dot=document.createElement("div");
    dot.className="track-dot"+(done?" done":i<=unlocked?" on":"");
    trackEl.appendChild(dot);
  });
  const current=Math.min(unlocked+1,course.length);
  progressCopy.textContent=completed.length===course.length?"Course complete":("Level "+current+" of "+course.length);
}

function openLevel(i){
  activeLevel=i; activeSlide=0;
  lesson.classList.add("open");
  lessonTitle.textContent="Level "+(i+1)+" — "+course[i].title;
  introSmall.textContent="Level "+(i+1)+" of "+course.length+" • "+course[i].duration;
  introTitle.textContent=course[i].title;
  introText.textContent=course[i].intro;
  intro.classList.add("show");
  renderSlide();
}

function makeVisual(s){
  if(s.type==="icon"){
    return '<div class="visual"><div class="big-icon">'+s.icon+'</div><div class="visual-caption">'+s.caption+'</div></div>';
  }
  if(s.type==="map"){
    return '<div class="visual"><div class="map">'+s.steps.map((x,i)=>'<div class="map-step">'+x+'</div>'+(i<s.steps.length-1?'<div class="map-arrow">→</div>':'')).join("")+'</div></div>';
  }
  if(s.type==="real"){
    return '<div class="visual"><div class="real"><div class="real-tag">Real Ohio example</div><h3>'+s.realTitle+'</h3><p>'+s.realText+'</p><div class="real-flow">'+s.realFlow.map(x=>'<span>'+x+'</span>').join("")+'</div>'+(s.source?'<a class="source-link" href="'+SOURCE[s.source]+'" target="_blank" rel="noreferrer">View official Ohio record ↗</a>':'')+'</div></div>';
  }
  if(s.type==="people"){
    return '<div class="visual"><div class="people">'+s.people.map(p=>'<div class="person"><div class="emoji">'+p[0]+'</div><b>'+p[1]+'</b><span>'+p[2]+'</span></div>').join("")+'</div></div>';
  }
  if(s.type==="compare"){
    return '<div class="visual"><div class="compare"><div class="doc"><b>Earlier draft</b><div class="line"></div><div class="line short"></div><div class="line"></div><div class="line short"></div></div><div class="compare-arrow">→</div><div class="doc"><b>Revised draft</b><div class="line"></div><div class="line changed"></div><div class="line"></div><div class="line changed short"></div></div></div></div>';
  }
  if(s.type==="quiz"){
    return '<div class="visual"><div class="quiz">'+s.answers.map((a,i)=>'<button data-answer="'+i+'">'+a+'</button>').join("")+'<div class="quiz-feedback" id="quizFeedback"></div></div></div>';
  }
  if(s.type==="games"){
    return '<div class="visual"><div class="game-pair"><a class="game" style="text-decoration:none" href="index.html?page=health"><div><div class="emoji">🩺</div><h3>Health Committee</h3><p>Listen, question, amend, decide.</p></div></a><a class="game alt" style="text-decoration:none" href="index.html?page=arts"><div><div class="emoji">🎨</div><h3>Culture Drafting</h3><p>Write, revise, compare, implement.</p></div></a></div></div>';
  }
  return '<div class="visual"></div>';
}

function renderSlide(){
  const s=course[activeLevel].slides[activeSlide];
  lessonCount.textContent=(activeSlide+1)+" / "+course[activeLevel].slides.length;
  guideText.textContent=s.guide;
  const chips=s.chips?'<div class="micro">'+s.chips.map(x=>'<span>'+x+'</span>').join("")+'</div>':"";
  slide.innerHTML='<div class="slide-copy"><div class="kicker">'+s.kicker+'</div><h2>'+s.title+'</h2><p>'+s.text+'</p>'+chips+(s.source&&s.type!=="real"?'<a class="source-link" href="'+SOURCE[s.source]+'" target="_blank" rel="noreferrer">Official Ohio source ↗</a>':'')+'</div>'+makeVisual(s);

  if(s.type==="quiz"){
    slide.querySelectorAll("[data-answer]").forEach(btn=>{
      btn.onclick=()=>{
        slide.querySelectorAll("[data-answer]").forEach(b=>b.classList.remove("right","wrong"));
        const pick=Number(btn.dataset.answer);
        btn.classList.add(pick===s.correct?"right":"wrong");
        document.getElementById("quizFeedback").textContent=pick===s.correct?s.success:"Not quite — try the option that best matches the legislative process.";
      };
    });
  }

  dots.innerHTML=course[activeLevel].slides.map((_,i)=>'<i class="'+(i===activeSlide?"on":"")+'"></i>').join("");
  prevBtn.style.visibility=activeSlide===0?"hidden":"visible";
  const last=activeSlide===course[activeLevel].slides.length-1;
  nextBtn.textContent=last?"Finish level ✓":"Next →";
  nextBtn.classList.toggle("finish",last);
}

function finishLevel(){
  if(!completed.includes(activeLevel)) completed.push(activeLevel);
  completed.sort((a,b)=>a-b);
  if(activeLevel<course.length-1) unlocked=Math.max(unlocked,activeLevel+1);
  localStorage.setItem("ohCourseUnlockedV2",String(unlocked));
  localStorage.setItem("ohCourseCompletedV2",JSON.stringify(completed));
  renderHome();
  lesson.classList.remove("open");
}

document.getElementById("startBtn").onclick=()=>intro.classList.remove("show");
document.getElementById("closeBtn").onclick=()=>lesson.classList.remove("open");
prevBtn.onclick=()=>{if(activeSlide>0){activeSlide--;renderSlide()}};
nextBtn.onclick=()=>{
  if(activeSlide<course[activeLevel].slides.length-1){activeSlide++;renderSlide()}
  else finishLevel();
};
document.addEventListener("keydown",e=>{
  if(!lesson.classList.contains("open")||intro.classList.contains("show"))return;
  if(e.key==="Escape")lesson.classList.remove("open");
  if(e.key==="ArrowRight")nextBtn.click();
  if(e.key==="ArrowLeft"&&activeSlide>0)prevBtn.click();
});

renderHome();
</script>
</body>
</html>
